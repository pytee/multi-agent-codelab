<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Building a Multi-Agent System</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface2:    #21262d;
      --border:      #30363d;
      --accent:      #58a6ff;
      --accent2:     #3fb950;
      --accent3:     #f78166;
      --accent4:     #e3b341;
      --text:        #e6edf3;
      --text-muted:  #8b949e;
      --code-bg:     #1c2128;
      --step-active: #58a6ff;
      --nav-w:       280px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      display: flex;
      min-height: 100vh;
    }

    /* ─── Sidebar Navigation ────────────────────────────────────── */
    .sidebar {
      width: var(--nav-w);
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0; left: 0;
      overflow-y: auto;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #58a6ff, #3fb950);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: #0d1117;
      flex-shrink: 0;
    }

    .sidebar-logo span {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    .steps-nav { padding: 8px 0; flex: 1; }

    .step-link {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 13px;
      border-left: 3px solid transparent;
    }

    .step-link:hover { background: var(--surface2); color: var(--text); }

    .step-link.active {
      background: rgba(88,166,255,0.08);
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .step-number {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-link.done .step-number {
      background: var(--accent2);
      border-color: var(--accent2);
      color: #0d1117;
    }

    .step-link.done .step-number::after { content: "✓"; }
    .step-link.done .step-number span { display: none; }

    .step-label { line-height: 1.4; }

    /* ─── Main Content ──────────────────────────────────────────── */
    .main {
      margin-left: var(--nav-w);
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 90;
    }

    .breadcrumb {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text-muted);
    }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb .sep { color: var(--border); }

    .progress-info {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ─── Step Section ──────────────────────────────────────────── */
    .step-section {
      display: none;
      padding: 48px 56px 80px;
      max-width: 900px;
    }

    .step-section.active { display: block; }

    .step-header {
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .step-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(88,166,255,0.1);
      color: var(--accent);
      border: 1px solid rgba(88,166,255,0.3);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 16px;
    }

    .step-section h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .step-duration {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .step-duration::before { content: "⏱"; }

    /* ─── Content Elements ──────────────────────────────────────── */
    .content h2 {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text);
      margin: 32px 0 12px;
    }

    .content h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      margin: 24px 0 8px;
    }

    .content p { margin-bottom: 14px; color: var(--text); }

    .content ul, .content ol {
      margin: 12px 0 16px 20px;
    }

    .content li { margin-bottom: 6px; }

    .content a { color: var(--accent); text-decoration: none; }
    .content a:hover { text-decoration: underline; }

    /* ─── Code Blocks ───────────────────────────────────────────── */
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      overflow-x: auto;
      margin: 16px 0 24px;
      position: relative;
      font-size: 13.5px;
      line-height: 1.65;
    }

    pre .copy-btn {
      position: absolute;
      top: 10px; right: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px; cursor: pointer;
      transition: all 0.15s;
    }

    pre .copy-btn:hover { background: var(--surface); color: var(--text); }
    pre .copy-btn.copied { color: var(--accent2); border-color: var(--accent2); }

    code {
      font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
    }

    p code, li code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.87em;
      color: #f0883e;
    }

    /* Syntax highlighting */
    .kw  { color: #ff7b72; }   /* keywords */
    .str { color: #a5d6ff; }   /* strings */
    .cm  { color: #8b949e; font-style: italic; }  /* comments */
    .fn  { color: #d2a8ff; }   /* functions */
    .cls { color: #ffa657; }   /* classes */
    .num { color: #79c0ff; }   /* numbers */
    .var { color: #e6edf3; }   /* variables */
    .op  { color: #ff7b72; }   /* operators */

    /* Language label */
    pre[data-lang]::before {
      content: attr(data-lang);
      position: absolute;
      top: 10px; left: 16px;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: sans-serif;
    }

    pre[data-lang] code { display: block; padding-top: 18px; }

    /* ─── Callout Boxes ─────────────────────────────────────────── */
    .callout {
      border-radius: 10px;
      padding: 16px 20px;
      margin: 20px 0;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 14px;
    }

    .callout-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }

    .callout.info    { background: rgba(88,166,255,0.08);  border: 1px solid rgba(88,166,255,0.25); }
    .callout.success { background: rgba(63,185,80,0.08);   border: 1px solid rgba(63,185,80,0.25); }
    .callout.warning { background: rgba(227,179,65,0.08);  border: 1px solid rgba(227,179,65,0.25); }
    .callout.tip     { background: rgba(210,168,255,0.08); border: 1px solid rgba(210,168,255,0.25); }

    .callout.info    .callout-icon { color: var(--accent); }
    .callout.success .callout-icon { color: var(--accent2); }
    .callout.warning .callout-icon { color: var(--accent4); }
    .callout.tip     .callout-icon { color: #d2a8ff; }

    /* ─── Architecture Diagram ──────────────────────────────────── */
    .arch-diagram {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      margin: 24px 0;
      text-align: center;
    }

    .arch-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0;
    }

    .agent-box {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      min-width: 130px;
      text-align: center;
      transition: border-color 0.2s;
    }

    .agent-box.orchestrator { border-color: var(--accent);  color: var(--accent); }
    .agent-box.researcher   { border-color: #d2a8ff;        color: #d2a8ff; }
    .agent-box.judge        { border-color: var(--accent4); color: var(--accent4); }
    .agent-box.builder      { border-color: var(--accent2); color: var(--accent2); }

    .agent-box .agent-port {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .arch-arrow {
      color: var(--text-muted);
      font-size: 20px;
    }

    .arch-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .arch-divider {
      width: 1px;
      height: 30px;
      background: var(--border);
      margin: 0 auto;
    }

    /* ─── Inline Command ────────────────────────────────────────── */
    .cmd {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 10px;
      font-family: "SF Mono", monospace;
      font-size: 13px;
      color: var(--accent2);
    }

    /* ─── Table ─────────────────────────────────────────────────── */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 14px;
    }

    th {
      background: var(--surface2);
      color: var(--text);
      font-weight: 600;
      padding: 10px 16px;
      text-align: left;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
    }

    tr:hover td { background: rgba(255,255,255,0.02); color: var(--text); }

    /* ─── Navigation Footer ─────────────────────────────────────── */
    .step-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      gap: 16px;
    }

    .nav-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      transition: all 0.15s;
      text-decoration: none;
    }

    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

    .nav-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d1117;
    }

    .nav-btn.primary:hover { background: #79b8ff; border-color: #79b8ff; color: #0d1117; }

    .nav-btn.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

    /* ─── Progress Bar ──────────────────────────────────────────── */
    .progress-bar-wrap {
      background: var(--border);
      height: 3px;
      position: fixed;
      bottom: 0; left: var(--nav-w); right: 0;
      z-index: 50;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.4s ease;
    }

    /* ─── Tag Pills ─────────────────────────────────────────────── */
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    .tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ─── Mobile ────────────────────────────────────────────────── */
    .menu-toggle {
      display: none;
      background: none; border: none;
      color: var(--text); font-size: 20px;
      cursor: pointer; padding: 8px;
    }

    @media (max-width: 768px) {
      :root { --nav-w: 0px; }
      .sidebar { transform: translateX(-280px); width: 280px; transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); --nav-w: 280px; }
      .main { margin-left: 0; }
      .menu-toggle { display: flex; }
      .step-section { padding: 24px 20px 60px; }
      .top-bar { padding: 0 16px; }
    }
  </style>
</head>
<body>

<!-- ─── Sidebar ─────────────────────────────────────────────────────── -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <div class="logo-icon">A</div>
      <span>ADK Codelab</span>
    </div>
    <div class="sidebar-title">Building a Multi-Agent System</div>
  </div>
  <div class="steps-nav" id="stepsNav">
    <!-- populated by JS -->
  </div>
</nav>

<!-- ─── Main ────────────────────────────────────────────────────────── -->
<div class="main">
  <div class="top-bar">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="breadcrumb">
        <a href="#">Codelabs</a>
        <span class="sep">›</span>
        <span>Building a Multi-Agent System</span>
      </div>
    </div>
    <div class="progress-info" id="progressInfo">Step 1 of 13</div>
  </div>

  <!-- Steps -->
  <div id="stepsContainer"></div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:7.7%"></div>
  </div>
</div>

<script>
const STEPS = [
  {
    title: "Introduction",
    duration: "5 min",
    content: `
      <div class="step-header">
        <div class="step-badge">Step 1</div>
        <h1>Building a Multi-Agent System</h1>
        <div class="step-duration">5 minutes</div>
        <div class="tags">
          <span class="tag">ADK</span>
          <span class="tag">Multi-Agent</span>
          <span class="tag">Python</span>
          <span class="tag">Cloud Run</span>
          <span class="tag">Vertex AI</span>
        </div>
      </div>
      <div class="content">
        <p>Real-world problems are complex. While a single, monolithic LLM agent might seem like the simplest solution, it quickly becomes unwieldy. A better approach is to decompose tasks into specialized, focused agents — each doing one thing well.</p>

        <div class="callout info">
          <span class="callout-icon">💡</span>
          <div><strong>Key Insight:</strong> Specialized agents are easier to evaluate, debug, and improve independently. You can update one agent without affecting the entire pipeline.</div>
        </div>

        <h2>What You'll Build</h2>
        <p>In this codelab, you'll build a <strong>Course Creation System</strong> — a pipeline of four specialized agents working together:</p>

        <div class="arch-diagram">
          <div class="arch-title">Course Creation Pipeline Architecture</div>
          <div class="arch-row">
            <div class="agent-box orchestrator">
              🎯 Orchestrator
              <span class="agent-port">Port 8004</span>
            </div>
          </div>
          <div class="arch-divider"></div>
          <div class="arch-row">
            <div class="agent-box researcher">
              🔍 Researcher
              <span class="agent-port">Port 8001</span>
            </div>
            <span class="arch-arrow">→</span>
            <div class="agent-box judge">
              ⚖️ Judge
              <span class="agent-port">Port 8002</span>
            </div>
            <span class="arch-arrow">→</span>
            <div class="agent-box builder">
              ✍️ Content Builder
              <span class="agent-port">Port 8003</span>
            </div>
          </div>
        </div>

        <table>
          <thead><tr><th>Agent</th><th>Responsibility</th><th>Key Feature</th></tr></thead>
          <tbody>
            <tr><td><code>Researcher</code></td><td>Searches the web for topic information</td><td>Google Search tool</td></tr>
            <tr><td><code>Judge</code></td><td>Evaluates research quality (pass/fail)</td><td>Structured Pydantic output</td></tr>
            <tr><td><code>Content Builder</code></td><td>Creates the final course material</td><td>Markdown formatting</td></tr>
            <tr><td><code>Orchestrator</code></td><td>Manages the overall workflow loop</td><td>A2A protocol</td></tr>
          </tbody>
        </table>

        <h2>What You'll Learn</h2>
        <ul>
          <li>How to build focused, single-purpose agents with the Agent Development Kit (ADK)</li>
          <li>How to implement quality control loops using <code>LoopAgent</code> and <code>SequentialAgent</code></li>
          <li>How to connect agents via the <strong>Agent-to-Agent (A2A)</strong> protocol over HTTP</li>
          <li>How to deploy a distributed multi-agent system to <strong>Cloud Run</strong></li>
        </ul>

        <h2>Prerequisites</h2>
        <ul>
          <li>Basic Python knowledge</li>
          <li>A Google Cloud project with billing enabled</li>
          <li>Familiarity with terminal/command-line tools</li>
        </ul>
      </div>
    `
  },
  {
    title: "Setup & Environment",
    duration: "10 min",
    content: `
      <div class="step-header">
        <div class="step-badge">Step 2</div>
        <h1>Setup &amp; Environment</h1>
        <div class="step-duration">10 minutes</div>
      </div>
      <div class="content">
        <h2>1. Activate Cloud Shell</h2>
        <p>Open <a href="https://shell.cloud.google.com" target="_blank">Google Cloud Shell</a> and ensure the correct project is selected.</p>

        <h2>2. Enable Required APIs</h2>
        <pre data-lang="bash"><code><span class="fn">gcloud</span> services enable \\
  aiplatform.googleapis.com \\
  run.googleapis.com \\
  cloudbuild.googleapis.com</code><button class="copy-btn" onclick="copyCode(this)">Copy</button></pre>

        <h2>3. Clone the Repository</h2>
        <pre data-lang="bash"><code><span class="fn">git</span> clone https://github.com/GoogleCloudPlatform/agent-developer-kit-samples
<span class="fn">cd</span> agent-developer-kit-samples/multi-agent-course-creator</code><button class="copy-btn" onclick="copyCode(this)">Copy</button></pre>

        <h2>4. Install Dependencies</h2>
        <p>This project uses <code>uv</code> for fast Python package management:</p>
        <pre data-lang="bash"><code><span class="cm"># Install uv if you haven't already</span>
<span class="fn">pip</span> install uv

<span class="cm"># Install project dependencies</span>
<span class="fn">uv</span> sync</code><button class="copy-btn" onclick="copyCode(this)">Copy</button></pre>

        <h2>5. Configure Environment Variables</h2>
        <p>Create a <code>.env</code> file in the project root:</p>
        <pre data-lang="bash"><code><span class="fn">cat</span> &gt; .env &lt;&lt; <span class="str">EOF</span>
GOOGLE_CLOUD_PROJECT=your-project-id
GOOGLE_GENAI_USE_VERTEXAI=true
GOOGLE_CLOUD_LOCATION=us-central1
<span class="str">EOF</span></code><button class="copy-btn" onclick="copyCode(this)">Copy</button></pre>

        <div class="callout warning">
          <span class="callout-icon">⚠️</span>
          <div>Replace <code>your-project-id</code> with your actual Google Cloud project ID. You can find it by running <code>gcloud config get project</code>.</div>
        </div>
      </div>
    `
  },
  {
    title: "Researcher Agent",
    duration: "10 min",
    content: `
      <div class="step-header">
        <div class="step-badge">Step 3</div>
        <h1>The Researcher Agent</h1>
        <div class="step-duration">10 minutes</div>
      </div>
      <div class="content">
        <p>The Researcher agent's sole job is to search the web and compile information about a given topic. By keeping it focused, it becomes easy to test and improve independently.</p>

        <h2>Creating the Agent</h2>
        <p>Create <code>researcher/agent.py</code>:</p>
        <pre data-lang="python"><code><span class="kw">from</span> google.adk.agents <span class="kw">import</span> Agent
<span class="kw">from</span> google.adk.tools <span class="kw">import</span> google_search

<span class="cls">MODEL</span> = <span class="str">"gemini-2.0-flash"</span>

<span class="cls">RESEARCHER_PROMPT</span> = <span class="str">"""
You are an expert researcher. Your job is to search the web
and compile comprehensive, accurate information about the given topic.

Focus on:
- Core concepts and definitions
- Key techniques and best practices
- Real-world examples and use cases
- Recent developments

Return well-organized, factual content ready for course creation.
"""</span>

researcher_agent = <span class="cls">Agent</span>(
    name=<span class="str">"researcher"</span>,
    model=<span class="cls">MODEL</span>,
    instruction=<span class="cls">RESEARCHER_PROMPT</span>,
    tools=[google_search],
)</code><button class="copy-btn" onclick="copyCode(this)">Copy</button></pre>

        <div class="callout tip">
          <span class="callout-icon">🔮</span>
          <div><strong>Design principle:</strong> The agent has exactly one tool (<code>google_search</code>) and one clear purpose. This makes it predictable, testable, and replaceable.</div>
        </div>

        <h2>How It Works</h2>
        <ul>
          <li>The <code>Agent</code> class wraps a Gemini model with instructions and tools</li>
          <li><code>google_search</code> is a built-in ADK tool that queries Google Search</li>
          <li>The model decides when and how to use the tool based on the prompt</li>

// ─── State ─────────────────────────────────────────────────────────────
let currentStep = 0;
const TOTAL = STEPS.length;

// ─── Render Nav ─────────────────────────────────────────────────────────
function renderNav() {
  const nav = document.getElementById('stepsNav');
  nav.innerHTML = STEPS.map((s, i) => `
    <a class="step-link ${i === currentStep ? 'active' : i < currentStep ? 'done' : ''}"
       onclick="goTo(${i})" href="#">
      <div class="step-number"><span>${i + 1}</span></div>
      <div class="step-label">${s.title}</div>
    </a>
  `).join('');
}

// ─── Render Steps ───────────────────────────────────────────────────────
function renderSteps() {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = STEPS.map((s, i) => `
    <div class="step-section ${i === 0 ? 'active' : ''}" id="step-${i}">
      ${s.content}
      <div class="step-footer">
        <a class="nav-btn ${i === 0 ? 'disabled' : ''}" onclick="goTo(${i - 1})" href="#">
          ← Previous
        </a>
        <a class="nav-btn primary ${i === TOTAL - 1 ? 'disabled' : ''}" onclick="goTo(${i + 1})" href="#">
          ${i === TOTAL - 1 ? 'Complete' : 'Next Step →'}
        </a>
      </div>
    </div>
  `).join('');
}

// ─── Navigation ─────────────────────────────────────────────────────────
function goTo(idx) {
  if (idx < 0 || idx >= TOTAL) return;
  document.getElementById(`step-${currentStep}`).classList.remove('active');
  currentStep = idx;
  document.getElementById(`step-${currentStep}`).classList.add('active');
  renderNav();
  document.getElementById('progressInfo').textContent = `Step ${idx + 1} of ${TOTAL}`;
  document.getElementById('progressFill').style.width = `${((idx + 1) / TOTAL) * 100}%`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ─── Copy to clipboard ──────────────────────────────────────────────────
function copyCode(btn) {
  const pre = btn.parentElement;
  const code = pre.querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ─── Init ────────────────────────────────────────────────────────────────
renderSteps();
renderNav();
